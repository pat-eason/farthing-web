name: Update version indicator

# Triggered by a repository_dispatch from the Farthing repo when a release is
# published (sent directly from Farthing's release.yml). Writes the released
# version into src/version.ts and lands it on main via an auto-merged PR — main
# is protected to require pull requests, so a direct push is rejected. The merge
# to main triggers the DigitalOcean App Platform auto-redeploy. workflow_dispatch
# allows a manual override / backfill.
on:
  repository_dispatch:
    types: [farthing-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set (with or without leading v, e.g. v0.3.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-version
  cancel-in-progress: false

jobs:
  update:
    name: Write version indicator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          RAW="${{ github.event.client_payload.version || inputs.version }}"
          if [ -z "$RAW" ]; then
            echo "::error::No version supplied via client_payload or workflow input"
            exit 1
          fi
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Write version file
        run: |
          cat > src/version.ts <<EOF
          // Auto-managed by .github/workflows/update-version.yml on Farthing releases.
          // Do not edit by hand; the workflow overwrites this file wholesale.
          export const VERSION = '${VERSION}';
          EOF

      - name: Open and auto-merge version PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/version.ts; then
            echo "Version already ${VERSION}; nothing to do."
            exit 0
          fi

          BRANCH="chore/version-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/version.ts
          git commit -m "chore: set version indicator to v${VERSION}"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: set version indicator to v${VERSION}" \
            --body "Automated version-indicator update to v${VERSION}."

          # main requires a PR (0 approvals), so merge it ourselves. Mergeability
          # can lag a moment after creation, so retry a few times.
          merged=false
          for i in $(seq 1 6); do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              merged=true
              break
            fi
            echo "Merge attempt $i failed; retrying in 5s..."
            sleep 5
          done
          if [ "$merged" != "true" ]; then
            echo "::error::Failed to merge version PR for v${VERSION}"
            exit 1
          fi
